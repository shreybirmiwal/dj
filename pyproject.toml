[project]
name = "setmix"
version = "0.1.0"
description = "Text-first, beat-aligned DJ mix planner and renderer"
requires-python = ">=3.11"
dependencies = [
  "librosa==0.10.2.post1",
  "numpy==1.26.4",
  "scipy==1.12.0",
  "soundfile==0.12.1",
]

[project.optional-dependencies]
stems = ["demucs==4.0.1"]
desktop = [
  "mido>=1.3,<2",
  "python-rtmidi>=1.5,<2",
  "pywebview>=5,<7",
]

[project.scripts]
setmix = "setmix.cli:main"
setmix-app = "setmix.desktop:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
